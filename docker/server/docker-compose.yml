# Projet Compose dédié — n'interfère PAS avec wp_tempoflow / n8n / tempoflow2.
# Usage :
#   export BRAND_ROOT=/opt/docker/tempoflow3
#   export CREEZIO_KIT_ROOT=/opt/docker/creezio
#   docker compose -p creezio-servers -f $CREEZIO_KIT_ROOT/docker/server/docker-compose.yml up -d --build
#
# Ou via CLI : creezio server-docker up --brand-root /opt/docker/tempoflow3
#
# Pattern instances : server-1, server-2, … (chiffres uniquement, pas de lettres).

name: creezio-servers

x-brand-server: &brand-server
  build:
    context: ${BRAND_ROOT:?set BRAND_ROOT to brand app root}
    dockerfile: ${CREEZIO_KIT_ROOT:-/opt/docker/creezio}/docker/server/Dockerfile
    args:
      # Layout 2 repos (monorepo client+server) : livrable serveur sous server/ (défaut).
      # Layout plat legacy : SERVER_DIR=. (le CLI creezio server-docker le déduit).
      SERVER_DIR: ${SERVER_DIR:-server}
  image: ${SERVER_IMAGE:-creezio-brand-server:local}
  restart: unless-stopped
  environment: &brand-env
    BRAND_ID: ${BRAND_ID:-tempoflow3}
    CREEZIO_HTTP_HOST: "0.0.0.0"
    CREEZIO_NATIVE_WARM: ${CREEZIO_NATIVE_WARM:-0}
    CREEZIO_TUNNEL_LOCAL: ${CREEZIO_TUNNEL_LOCAL:-1}
    CREEZIO_SKIP_KIT_BINARIES: ${CREEZIO_SKIP_KIT_BINARIES:-1}
    METIER_DATA_DIR: /data
    # Optionnels (tunnel / catalog) — passer via env host, jamais committer secrets
    CREEZIO_TUNNEL_PROVISION_URL: ${CREEZIO_TUNNEL_PROVISION_URL:-}
    CREEZIO_TUNNEL_PROVISION_TOKEN: ${CREEZIO_TUNNEL_PROVISION_TOKEN:-}
    CREEZIO_CATALOG_URL: ${CREEZIO_CATALOG_URL:-}
  networks:
    - creezio-servers

# Sécurité : ports publiés sur loopback par défaut.
# Opt-in exposition réseau : SERVER_BIND=0.0.0.0 (ou IP publique).
services:
  server-1:
    <<: *brand-server
    container_name: creezio-server-1
    ports:
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_1_PORT:-18791}:18791"
    environment:
      <<: *brand-env
      PORT: "18791"
      METIER_PORT: "18791"
      INSTANCE_ID: server-1
    volumes:
      - ${DATA_DIR:-./data}/server-1:/data

  server-2:
    <<: *brand-server
    container_name: creezio-server-2
    ports:
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_2_PORT:-18792}:18791"
    environment:
      <<: *brand-env
      PORT: "18791"
      METIER_PORT: "18791"
      INSTANCE_ID: server-2
    volumes:
      - ${DATA_DIR:-./data}/server-2:/data

networks:
  creezio-servers:
    name: creezio-servers
    driver: bridge
