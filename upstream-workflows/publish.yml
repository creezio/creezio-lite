# Publication npm des packages @creezio/* — npmjs.org (registre public officiel).
# Migration depuis GitHub Packages le 2026-08-31 (compte GitHub verrouillé
# facturation + packages publics → npmjs est gratuit et sans token à l'install).
# Secret requis : NPM_TOKEN (token Automation npmjs, org creezio).
#
# Flux nominal (docs/NPM-DISTRIBUTION.md) :
#   dev kit → `npx changeset` (intention de bump, lockstep) → merge main →
#   ce workflow ouvre/actualise la PR « Version Packages » →
#   merge de cette PR → publication automatique des nouvelles versions.
# Si aucun changeset n'est en attente, le job publie directement toute
# version locale absente du registre (cas du bootstrap initial).
# `version:packages` regenere aussi package-lock.json apres le bump :
# sans ca les entrees workspace du lock restent a l'ancienne version
# (desync 0.4.0 vs 0.5.0 — npm ci casse hors registre, CI hybride).
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-kit
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          scope: "@creezio"
      - run: npm ci --no-audit --no-fund
      - run: npm run build:packages
      - name: PR de version ou publication
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          version: npm run version:packages
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
