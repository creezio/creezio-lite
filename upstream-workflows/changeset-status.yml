# Gate PR : un changement de packages/ doit être couvert par un changeset,
# sinon la version ne bumpe pas et les apps consommatrices ne verront JAMAIS
# le nouveau contenu (leçon des incidents vendoring : contenu changé sans
# version = invisible pour npm ET pour le cache webpack).
name: Changeset status

on:
  pull_request:

jobs:
  status:
    # Exception historique : la PR de migration bootstrap (feat/npm-distribution) bumpait à la main.
    if: github.head_ref != 'feat/npm-distribution'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # PR de version : « pas de changeset orphelin » (les files ont été
      # consommés). Autres PR : `changeset status --since=base`.
      - name: Changeset status
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          CHANGESET_SINCE: origin/${{ github.base_ref }}
        run: node scripts/changeset-status-check.mjs
