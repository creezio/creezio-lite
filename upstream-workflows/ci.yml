# CI kit Creezio — filet anti-régression des fonctions NATIVES.
#
# Les tests natifs (test-phase-*, test-os-*) vivent ICI, jamais dupliqués
# dans les apps consommatrices : une app ne teste que son métier (gates
# colocalisées brand-spec/modules/*/gate.mjs) + son intégration (gates
# transversales).
#
# Modèle open source PULL : le kit NE CONNAÎT PAS ses consommateurs — pas de
# registre, pas de notification, pas de test des apps ici. Le kit publie des
# packages npm versionnés (publish.yml + changesets ; changelog +
# ARCHITECTURE_VERSION + codemods — la gate arch-codemod refuse un bump sans
# migration : c'est ELLE qui protège les apps). Chaque app tire le kit quand
# elle le décide : `npm update "@creezio/*"` + sa CI (docs/PROPAGATION.md).
#
# 2 étages :
#   1. build-and-test (GitHub-hosted) : build workspaces + suite kit rapide
#      sur chaque push/PR ;
#   2. nightly-suites (self-hosted, cron) : suites lourdes `brands` + `env`
#      (apps sondes locales, Docker, Electron) qui ne tournent pas sur
#      GH-hosted.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'push' }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      CREEZIO_SKIP_KIT_BINARIES: "1"
      CREEZIO_NATIVE_WARM: "0"
      # Gates scaffold/factory : --link-kit pin @creezio/* sur le worktree
      # (PR de release : version pas encore sur GitHub Packages).
      CREEZIO_LINK_KIT: "1"
      # Token encore utile hors --link-kit (deps publiques + nightly).
      CREEZIO_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build workspaces (source unique)
        run: npm run build:packages

      # apps/demobrand n'est pas couverte par --packages-only ; ses artefacts
      # build/electron sont importés par plusieurs gates (phase-d, i*, v*…).
      # Sans cette étape elles ne passent que sur un clone de dev ayant déjà
      # buildé l'app — jamais sur un checkout CI vierge.
      - name: Build app sonde demobrand
        run: npm run build -w @creezio/app-demobrand

      - name: Suite kit rapide
        run: npm run test:kit -- --keep-going

  # Suites lourdes nightly sur le VPS : apps sondes (tempoflow3…),
  # environnement Docker/Electron réel.
  nightly-suites:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, fluxpro]
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    env:
      CREEZIO_NATIVE_WARM: "0"
      CREEZIO_LINK_KIT: "1"
      CREEZIO_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # App sonde : clone de dev du VPS (le checkout runner n'a pas de
      # sibling tempoflow3).
      CREEZIO_TEMPOFLOW3_ROOT: /home/fidus/tempoflow3
      # Gates « binaires natifs » (os-native-pnp, os-shell-contracts) : le
      # VPS a le réseau et le cache runner persiste entre les runs.
      CREEZIO_KIT_BINARIES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: npm ci

      - name: Build workspaces
        run: npm run build:packages

      - name: Build app sonde demobrand
        run: npm run build -w @creezio/app-demobrand

      - name: Suite kit
        run: npm run test:kit -- --keep-going

      - name: Suite brands (apps sondes)
        run: npm run test:brands -- --keep-going

      - name: Suite env (Docker / Electron)
        run: npm run test:env -- --keep-going
