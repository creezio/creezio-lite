name: Lite
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install locked template dependencies
        run: pnpm --dir template install --frozen-lockfile
      - name: Verify migrations with the installed Wrangler splitter
        run: pnpm --dir template run check:sites-migrations
      - run: npm run test:sites
      - run: npm run check
      - run: pnpm --dir template run typecheck
      - run: pnpm --dir template run build
      - name: Verify the rendered OAuth consent and complete HTTP flow
        run: node scripts/verify-oauth-consent.mjs
      - name: Verify phone-to-desktop relay without consuming SSE and native WebSockets
        run: node scripts/verify-browser-relay.mjs
      - name: Generate two independent applications
        run: node scripts/validate-examples.mjs
      - name: Validate mail connectors without sending email
        run: |
          pnpm --dir connectors/mail-gateway install --frozen-lockfile
          node --test connectors/mail-gateway/server.test.mjs
          pnpm --dir connectors/cloudflare-mail install --frozen-lockfile
          node --test connectors/cloudflare-mail/worker.test.mjs
          pnpm --dir connectors/cloudflare-mail exec wrangler deploy --dry-run --outdir dist
