brandId: {{brandId}}
brandName: {{brandName}}
domain: {{domain}}
tagline: {{tagline}}
vertical: {{vertical}}
sandbox: true

platform:
  auth: true
  desktop: true
  pluginApi: true
  chat: true
  sync: false
  meili: true
  mcp: true
  onboarding: {{onboardingEnabled}}

meili:
  enabled: true
  feedPreset: {{meiliPreset}}

