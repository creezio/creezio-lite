  enabled: true
  allowUnauthenticated: true
  spaces:
    - module
    - plugin

onboarding:
  enabled: {{onboardingEnabled}}
  slugPlaceholder: mon-espace
  requireOpenaiKey: false
  afterCompleteHref: {{afterCompleteHref}}
